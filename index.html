<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infernal Arena - 2D Fighting Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="select-none flex items-center justify-center">

    <!-- HERO SELECTION MODAL -->
    <div id="heroSelectScreen" class="fixed inset-0 z-50 flex flex-col justify-between p-4 bg-slate-950/95 backdrop-blur-md overflow-y-auto">
        <div class="text-center my-2">
            <h1 class="text-3xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-red-500 to-purple-600 uppercase">
                INFERNAL ARENA
            </h1>
            <p class="text-amber-400 text-xs md:text-sm font-semibold mt-1">Step 1: Choose Your Champion</p>
            <div id="statsMemoryDisplay" class="mt-2 text-xs text-slate-400 font-mono">
                Wins: <span id="memWins" class="text-emerald-400 font-bold">0</span> | Matches: <span id="memMatches" class="text-cyan-400 font-bold">0</span>
            </div>
        </div>

        <!-- HERO CARDS CONTAINER -->
        <div id="heroContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 my-auto max-w-4xl mx-auto w-full p-2">
            <!-- Hero cards dynamically loaded -->
        </div>

        <button id="toSelectMapBtn" class="w-full max-w-sm mx-auto py-3 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 text-white font-black text-lg tracking-widest rounded-xl shadow-lg shadow-orange-600/30 uppercase">
            NEXT: SELECT MAP <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
    </div>

    <!-- MAP SELECTION MODAL -->
    <div id="mapSelectScreen" class="hidden fixed inset-0 z-50 flex flex-col justify-between p-4 bg-slate-950/95 backdrop-blur-md overflow-y-auto">
        <div class="text-center my-2">
            <h2 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-amber-400 uppercase">
                Select Battle Map
            </h2>
            <p class="text-slate-400 text-xs md:text-sm mt-1">Choose your battlefield (5 Arenas)</p>
        </div>

        <!-- MAP CARDS CONTAINER -->
        <div id="mapContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 my-auto max-w-6xl mx-auto w-full p-2">
            <!-- Map cards dynamically loaded -->
        </div>

        <div class="flex gap-4 max-w-md mx-auto w-full">
            <button id="backToHeroBtn" class="w-1/3 py-3 bg-slate-800 text-slate-300 font-bold rounded-xl">BACK</button>
            <button id="startBattleBtn" class="w-2/3 py-3 bg-gradient-to-r from-red-600 to-orange-500 text-white font-black text-lg rounded-xl shadow-lg shadow-red-600/30 uppercase">START BATTLE</button>
        </div>
    </div>

    <!-- GAMEPLAY HUD & OVERLAY UI -->
    <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
        <div class="absolute top-2 left-2 right-2 z-20 flex justify-between items-center hud-glass px-4 py-2 rounded-xl max-w-4xl mx-auto">
            <div class="flex-1 mr-2">
                <div class="flex justify-between items-center mb-1">
                    <span id="hudP1Name" class="font-bold text-orange-400 text-xs md:text-sm">PLAYER 1</span>
                    <span id="hudP1HpText" class="text-xs font-mono text-amber-300">100 / 100</span>
                </div>
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-orange-500/40 p-0.5">
                    <div id="hudP1HpBar" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 rounded-full transition-all duration-100" style="width: 100%;"></div>
                </div>
            </div>
            <div class="px-2 py-0.5 bg-red-950 border border-red-500 rounded text-[10px] font-black text-red-400">VS</div>
            <div class="flex-1 ml-2 text-right">
                <div class="flex justify-between items-center mb-1">
                    <span id="hudP2HpText" class="text-xs font-mono text-purple-300">100 / 100</span>
                    <span id="hudP2Name" class="font-bold text-purple-400 text-xs md:text-sm">VILLAIN</span>
                </div>
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-purple-500/40 p-0.5" style="direction: rtl;">
                    <div id="hudP2HpBar" class="h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full transition-all duration-100" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <div id="mobileControls" class="absolute inset-0 z-30 pointer-events-none flex justify-between items-end p-2 md:p-6">
            <div class="pointer-events-auto flex flex-col items-start gap-2">
                <div class="flex flex-col gap-2 ml-1">
                    <button id="btnSkill1" class="left-control-btn w-12 h-12 md:w-14 md:h-14 rounded-full text-amber-300 font-extrabold text-xs flex items-center justify-center">S1</button>
                    <button id="btnSkill2" class="left-control-btn w-12 h-12 md:w-14 md:h-14 rounded-full text-orange-400 font-extrabold text-xs flex items-center justify-center">S2</button>
                    <button id="btnSkill3" class="left-control-btn w-12 h-12 md:w-14 md:h-14 rounded-full text-red-500 font-extrabold text-xs flex items-center justify-center">ULT</button>
                </div>
                <div id="moveJoystickBase" class="joystick-base relative w-28 h-28 md:w-36 md:h-36 rounded-full flex items-center justify-center">
                    <div id="moveJoystickThumb" class="joystick-thumb w-12 h-12 md:w-14 md:h-14 rounded-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></div>
                </div>
            </div>

            <div class="pointer-events-auto flex flex-col items-end gap-2">
                <button id="btnJump" class="left-control-btn w-12 h-12 md:w-14 md:h-14 rounded-full text-emerald-400 font-extrabold text-xs flex items-center justify-center mb-2">JUMP</button>
                <div id="aimJoystickBase" class="joystick-base relative w-28 h-28 md:w-36 md:h-36 rounded-full flex items-center justify-center border-cyan-500/50">
                    <div id="aimJoystickThumb" class="aim-thumb w-12 h-12 md:w-14 md:h-14 rounded-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></div>
                </div>
                <span class="text-[9px] text-cyan-300 font-mono tracking-tighter">AIM JOYSTICK</span>
            </div>
        </div>

        <div id="gameOverModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md">
            <div class="hud-glass p-6 rounded-2xl text-center max-w-sm w-full mx-4 border-2 border-red-500/50">
                <h2 id="winnerText" class="text-3xl font-black text-amber-400 mb-2">VICTORY!</h2>
                <p id="winnerSubText" class="text-slate-300 text-sm mb-6">Player 1 dominated the arena.</p>
                <button id="restartBtn" class="w-full py-3 bg-gradient-to-r from-red-600 to-orange-500 text-white font-extrabold rounded-xl uppercase">Play Again</button>
            </div>
        </div>
    </div>

    <!-- JS SCRIPTS WITH FALLBACK HANDLERS -->
    <!-- HERO FILES LOAD (1 TO 30) -->
    <script src="hero-1.js" onerror="console.warn('hero-1.js missing, using default')"></script>
    <!-- နောက်မှ ထပ်ဖြည့်မည့် hero-2.js မှ hero-30.js တို့အတွက် safe loader -->
    
    <!-- MAP FILES LOAD (1 TO 5) -->
    <script src="map-1.js" onerror="console.warn('map-1.js missing, using default')"></script>
    
    <!-- SYSTEM CORE -->
    <script src="main-menu.js"></script>
    <script src="game.js"></script>
</body>
</html>
